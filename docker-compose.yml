version: '3.8'

services:
  # PostgreSQL Database
  postgres:
    image: postgres:15-alpine
    container_name: uriesmooth-voice-postgres
    environment:
      POSTGRES_DB: uriesmooth_voice
      POSTGRES_USER: voice_app
      POSTGRES_PASSWORD: changeme
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - uriesmooth-network
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U voice_app']
      interval: 10s
      timeout: 5s
      retries: 5

  # pgAdmin (Database Management UI)
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: uriesmooth-voice-pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@uriesmooth.ai
      PGADMIN_DEFAULT_PASSWORD: admin
    ports:
      - "5050:80"
    depends_on:
      - postgres
    networks:
      - uriesmooth-network

volumes:
  postgres_data:
    driver: local

networks:
  uriesmooth-network:
    driver: bridge
